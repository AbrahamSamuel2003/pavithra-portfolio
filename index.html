<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pavithra S — Software Developer. Web development, Python, machine learning and NLP." />
    <meta name="theme-color" content="#E8DCC6" />
    <title>Pavithra S — Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip-path: inset(100%) !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      (function () {
        function removeBadge() {
          var frames = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"], iframe[title*="Powered by Netlify"]');
          frames.forEach(function (el) { el.remove(); });
        }
        if (window.MutationObserver) {
          new MutationObserver(removeBadge).observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeBadge);
        window.addEventListener('load', removeBadge);
      })();
    </script>
  </head>
  <body>
    <!-- Static copy of the contact form so Netlify Forms can detect it at deploy time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
